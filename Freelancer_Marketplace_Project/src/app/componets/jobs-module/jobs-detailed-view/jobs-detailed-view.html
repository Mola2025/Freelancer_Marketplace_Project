<div
    class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-600 to-[#2a1f4a] flex items-center justify-center px-4">
    <div class="max-w-2xl mx-auto">
        <a routerLink="/jobs" class="text-amber-400 hover:text-amber-300 text-sm transition">← Back to Jobs</a>
        <div *ngIf="job" class="detail-card">

            <div class="flex items-start justify-between gap-4 mb-6">
                <h1 class="text-2xl font-black text-white leading-tight">{{ job.title }}</h1>
                <span [ngClass]="'status-badge status-' + job.status">{{ job.status }}</span>
            </div>

            <div class="flex flex-wrap gap-3 mb-6">
                <span class="meta-chip">{{ job.category }}</span>
                <span class="meta-chip">{{ job.budget }}</span>
                <span class="meta-chip">{{ job.owner?.username }}</span>
                <span *ngIf="job.freelancer" class="meta-chip">{{ job.freelancer.username }}</span>
            </div>

            <div class="border-t border-slate-700 my-5"></div>

            <p class="text-slate-400 text-xs uppercase tracking-widest font-semibold mb-2">Description</p>
            <p class="text-slate-200 text-sm leading-relaxed">{{ job.description }}</p>

            <div class="border-t border-slate-700 my-5"></div>

            <div class="flex flex-wrap gap-3">
                <a *ngIf="isOwner()" [routerLink]="['/jobs', job.id, 'edit']" class="btn btn-primary">Edit Job</a>

                <a *ngIf=" job.status === 'open' && isOwner()" [routerLink]="['/jobs', job.id, 'proposals']"
                    class="btn btn-primary">View Proposals</a>

                <button *ngIf="job.status === 'in_progress' && isOwner()" (click)="markJobCompleted()"
                    class="btn btn-primary">Mark Completed</button>

            </div>
        </div>

        <div *ngIf="errorMessage"
            class="mb-4 bg-red-900/40 border border-red-500/50 text-red-300 text-sm rounded-lg px-4 py-3">
            {{ errorMessage }}
        </div>
        <p *ngIf="!job" class="text-center text-slate-400 mt-20">Loading job details...</p>
    </div>
</div>
