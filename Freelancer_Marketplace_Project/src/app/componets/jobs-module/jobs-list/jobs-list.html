<!-- Background -->
<div
    class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-600 to-[#2a1f4a] flex items-center justify-center px-4 mb-4">
    <div class="max-w-4xl mx-auto">

        <div class="flex items-center justify-between mb-8 mt-4">
            <h1 class="text-3xl font-black text-white tracking-tight">
                Available<span class="text-amber-400">Jobs</span>
            </h1>
            <a routerLink="/jobs/new" class="btn btn-primary">New Job</a>
        </div>

        <div class="flex flex-wrap gap-3 mb-8">
            <input type="text" placeholder="Category" [(ngModel)]="filterCategory" class="filter-input" />
            <input type="number" placeholder="Min Budget" [(ngModel)]="filterMinBudget" class="filter-input" />
            <select [(ngModel)]="filterStatus" class="filter-input" name="status" title="status">
                <option value="">All Status</option>
                <option value="open">Open</option>
                <option value="in_progress">In Progress</option>
                <option value="completed">Completed</option>
            </select>
            <button (click)="loadJobs()" class="btn btn-primary">Search</button>
        </div>

        <div *ngIf="errorMessage"
            class="mb-4 bg-red-900/40 border border-red-500/50 text-red-300 text-sm rounded-lg px-4 py-3">
            {{ errorMessage }}
        </div>

        <p *ngIf="jobs.length === 0" class="text-center text-slate-400 mt-20">No jobs found</p>

        <div class="flex flex-col gap-4">
            <div *ngFor="let job of jobs" class="job-card">
                <div class="flex items-start justify-between gap-4 mb-3">
                    <h4 class="text-white font-bold text-lg leading-tight">{{ job.title }}</h4>
                    <span [ngClass]="'status-badge status-' + job.status">{{ job.status }}</span>
                </div>

                <div class="flex flex-wrap gap-4 mb-3">
                    <span class="meta-chip"> {{ job.category }}</span>
                    <span class="meta-chip"> ${{ job.budget }}</span>
                </div>

                <p class="text-slate-400 text-sm mb-4 line-clamp-2">{{ job.description }}</p>

                <div class="flex flex-wrap gap-2">
                    <a [routerLink]="['/jobs', job.id]" class="btn-outline">View Detail</a>

                    <ng-container *ngIf="isOwner(job)">
                        <a [routerLink]="['/jobs', job.id, 'edit']" class="btn-outline">Edit</a>
                    </ng-container>

                    <button *ngIf="job.status === 'in_progress' && (isOwner(job) || isAssignedFreelancer(job))"
                        (click)="markJobCompleted(job.id)" class="btn-success">
                        Mark Completed
                    </button>

                    <a *ngIf="!isOwner(job) && job.status === 'open'" [routerLink]="['/jobs', job.id, 'proposal']"
                        class="btn btn-primary">Apply</a>

                    <a *ngIf="job.status === 'completed' && (isOwner(job) || isAssignedFreelancer(job))"
                        [routerLink]="['/jobs', job.id, 'review']" class="btn-outline">
                        Leave a Review
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
