<!-- Background -->
<div
    class="min-h-screen bg-gradient-to-br from-[#160030] via-[#2a0a4a] to-[#014d58] flex items-center justify-center px-4">

    <!-- Card  -->
    <div class="w-full max-w-md">

        <!-- Title -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-black text-white tracking-tight">
                Skill<span class="text-amber-400">Swap</span>
            </h1>
        </div>

        <!-- Form -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-8 shadow-2xl">
            <h2 class="text-xl font-bold text-white mb-6">Create your account</h2>

            <form (ngSubmit)="submit()">

                <!-- Name -->
                <div class="mb-4">
                    <label class="block text-slate-300 text-sm font-medium mb-1">Full Name</label>
                    <input [(ngModel)]="name" name="name" type="text" required placeholder="Joe Doe"
                        class="w-full bg-slate-900 border border-slate-600 text-white rounded-lg px-4 py-3 text-sm placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-400 focus:border-transparent transition" />
                </div>

                <!-- Username -->
                <div class="mb-4">
                    <label class="block text-slate-300 text-sm font-medium mb-1">Username</label>
                    <input [(ngModel)]="username" name="username" type="text" required placeholder="joe_doe"
                        class="w-full bg-slate-900 border border-slate-600 text-white rounded-lg px-4 py-3 text-sm placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-400 focus:border-transparent transition" />
                </div>

                <!-- Suggested username (Error 409) -->
                <div *ngIf="suggestedUsername"
                    class="mt-2 bg-amber-900/30 border border-amber-500/40 rounded-lg px-3 py-2 flex items-center justify-between">
                    <p class="text-amber-300 text-xs">
                        Username taken. Suggested: <strong>{{ suggestedUsername }}</strong>
                    </p>
                </div>

                <!-- Email -->
                <div class="mb-4">
                    <label class="block text-slate-300 text-sm font-medium mb-1">Email</label>
                    <input [(ngModel)]="email" name="email" type="email" required placeholder="youremail@example.com"
                        class="w-full bg-slate-900 border border-slate-600 text-white rounded-lg px-4 py-3 text-sm placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-400 focus:border-transparent transition" />
                </div>

                <!-- Password -->
                <div class="mb-6">
                    <label class="block text-slate-300 text-sm font-medium mb-1">Password</label>
                    <input [(ngModel)]="password" name="password" type="password" required placeholder="••••••••"
                        class="w-full bg-slate-900 border border-slate-600 text-white rounded-lg px-4 py-3 text-sm placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-400 focus:border-transparent transition" />
                </div>

                <!-- Bio -->
                <div class="mb-6">
                    <label class="block text-slate-300 text-sm font-medium mb-1">Bio</label>
                    <textarea [(ngModel)]="bio" name="bio"
                        placeholder="I'm a freelancer with a passion for web development..."
                        class="w-full bg-slate-900 border border-slate-600 text-white rounded-lg px-4 py-3 text-sm placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-400 focus:border-transparent transition resize-none h-24"></textarea>
                </div>

                <!-- Skills -->
                <div class="mb-6">
                    <label class="block text-slate-300 text-sm font-medium mb-1">Skills</label>
                    <textarea [(ngModel)]="skills" name="skills" placeholder="e.g., HTML, CSS, JavaScript..."
                        class="w-full bg-slate-900 border border-slate-600 text-white rounded-lg px-4 py-3 text-sm placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-400 focus:border-transparent transition resize-none h-24"></textarea>
                    <p><span class="text-slate-400 text-xs">Separate each skill with a comma.</span></p>
                </div>

                <!-- Error message -->
                <div *ngIf="errorMessage"
                    class="mb-4 bg-red-900/40 border border-red-500/50 text-red-300 text-sm rounded-lg px-4 py-3">
                    {{ errorMessage }}
                </div>

                <!-- Submit button -->
                <button type="submit"
                    class="w-full bg-amber-400 hover:bg-amber-300 disabled:opacity-50 disabled:cursor-not-allowed text-slate-900 font-bold rounded-lg px-4 py-3 text-sm transition-colors duration-200">
                    <span>Create Account</span>
                </button>

            </form>

            <!-- Link a register -->
            <p class="text-center text-slate-400 text-sm mt-6">
                Already have an account?
                <a routerLink="/login"
                    class="text-amber-400 hover:text-amber-300 font-medium transition-colors">Login</a>
            </p>
        </div>

    </div>
</div>
