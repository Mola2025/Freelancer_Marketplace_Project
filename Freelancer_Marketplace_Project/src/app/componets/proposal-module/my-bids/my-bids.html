<div
    class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-600 to-[#2a1f4a] flex items-center justify-center px-4">
    <div class="max-w-3xl mx-auto w-full">
        <div class="flex items-center justify-between mb-8">
            <h1 class="text-3xl font-black text-white tracking-tight mt-2">
                My <span class="text-amber-400">Bids</span>
            </h1>
            <a [routerLink]="['/jobs']" class="text-amber-400 hover:text-amber-600 transition">← Browse Jobs</a>
        </div>

        <div *ngIf="errorMessage"
            class="mb-4 bg-red-900/40 border border-red-500/50 text-red-300 text-sm rounded-lg px-4 py-3">
            {{ errorMessage }}
        </div>

        <p *ngIf="proposals.length === 0 && !errorMessage" class="text-center text-slate-400 mt-20">You havent made any
            proposals yet</p>

        <div class="flex flex-col gap-4">
            <div *ngFor="let proposal of proposals" class="bid-card">
                <div class="flex items-start justify-between gap-4 mb-3">
                    <div>
                        <h1 class="text-2xl font-black text-white leading-tight">{{ proposal.job_id }}</h1>
                    </div>
                    <span [ngClass]="'status-badge status-' + proposal.status">{{ proposal.status }}</span>
                </div>

                <div class="flex flex-wrap gap-3 mb-3">
                    <span class="meta-chip price-chip">{{ proposal.price }}</span>
                    <span *ngIf="proposal.job?.status" class="meta-chip">Job: {{ proposal.job?.status }}</span>
                </div>

                <p class="text-slate-300 text-sm leading-relaxed">{{ proposal.cover_letter }}</p>


                <div class="flex flex-wrap gap-3" *ngIf="proposal.status === 'pending'">
                    <a [routerLink]="['/jobs', proposal.job_id]" class="btn-outline">View
                        Job</a>
                    <button (click)="deleteProposal(proposal.id)" class="btn-delete"
                        [disabled]="deleteProposalId === proposal.id">{{ deleteProposalId === proposal.id ?
                        'Deleting...' :
                        'Delete Proposal' }}</button>
                </div>
            </div>
        </div>
    </div>
</div>
